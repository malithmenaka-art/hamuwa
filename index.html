<style>
/* Layout: fixed navy rail on the left, sticky top bar, one scrolling work area. Gold is reserved for trust signals. */
:root{
  --bg:#F1F4F9; --surface:#FFFFFF; --raised:#F6F8FC; --ink:#0B1F3A; --ink-2:#3F5068; --muted:#66768E; --line:#DCE2EC;
  --primary:#0D3665; --primary-ink:#FFFFFF; --primary-soft:#E4ECF7;
  --gold:#8A5D10; --gold-fill:#D8A43B; --gold-soft:#FAF1DC; --gold-ink:#3A2805;
  --good:#11693F; --good-soft:#E1F2E8; --warn:#8A5800; --warn-soft:#FCEFD3; --crit:#A8231C; --crit-soft:#FBE7E5;
  --side:#06182F; --side-2:#0E2A4F; --side-ink:#C6D3E8; --side-muted:#7F93B3; --side-line:#14294A;
  --chart:#1C5CAB; --grid:#E3E8F0; --axis:#B9C3D3;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 8px 24px rgba(11,31,58,.06);
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050F1D; --surface:#0B1A30; --raised:#102340; --ink:#E9EFF9; --ink-2:#BAC7DB; --muted:#8798B2; --line:#1C3050;
    --primary:#5A9DEE; --primary-ink:#04142B; --primary-soft:#12305A;
    --gold:#E9BE62; --gold-fill:#D8A43B; --gold-soft:#2B2410; --gold-ink:#2B1D03;
    --good:#55C891; --good-soft:#0F2D21; --warn:#F0B84A; --warn-soft:#30250C; --crit:#F28A82; --crit-soft:#381513;
    --side:#030A15; --side-2:#0E2A4F; --side-ink:#C6D3E8; --side-muted:#7F93B3; --side-line:#11233F;
    --chart:#3987E5; --grid:#172A47; --axis:#2B4166;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#050F1D; --surface:#0B1A30; --raised:#102340; --ink:#E9EFF9; --ink-2:#BAC7DB; --muted:#8798B2; --line:#1C3050;
  --primary:#5A9DEE; --primary-ink:#04142B; --primary-soft:#12305A;
  --gold:#E9BE62; --gold-fill:#D8A43B; --gold-soft:#2B2410; --gold-ink:#2B1D03;
  --good:#55C891; --good-soft:#0F2D21; --warn:#F0B84A; --warn-soft:#30250C; --crit:#F28A82; --crit-soft:#381513;
  --side:#030A15; --side-2:#0E2A4F; --side-ink:#C6D3E8; --side-muted:#7F93B3; --side-line:#11233F;
  --chart:#3987E5; --grid:#172A47; --axis:#2B4166;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--gold-fill);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
#app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:18px 12px 16px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 14px}
.brand img{width:40px;height:40px;border-radius:10px;background:#fff;flex:none}
.brand b{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.2em;color:#fff;display:block;line-height:1.1}
.brand span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-fill);white-space:nowrap}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navlabel{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:12px 10px 4px}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:9px;text-align:left;font-weight:500}
.nav:hover{background:var(--side-line);color:#fff}
.nav.on{background:var(--side-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold-fill)}
.nav.locked{opacity:.5}
.nav .count{margin-left:auto;background:var(--gold-fill);color:var(--gold-ink);font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.nav .lk{margin-left:auto;width:14px;height:14px}
.sidefoot{margin-top:auto;padding:12px 10px 0;font-size:11.5px;color:var(--side-muted);border-top:1px solid var(--side-line)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px clamp(16px,3vw,28px)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;position:relative}
.iconbtn:hover{background:var(--raised);color:var(--ink)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold-fill);box-shadow:0 0 0 2px var(--surface)}
#menuBtn{display:none}
.search{flex:1;min-width:0;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:0 11px;height:36px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.spacer{flex:1}
.viewas{display:flex;align-items:center;gap:8px;background:var(--gold-soft);border:1px solid var(--gold-fill);border-radius:10px;padding:0 6px 0 11px;height:36px;min-width:0}
.viewas label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600;white-space:nowrap}
.viewas select{border:0;background:none;font-weight:600;outline:0;min-width:0;max-width:190px;height:32px}
.viewas select option{background:var(--surface);color:var(--ink)}
.page{width:100%;max-width:1200px;margin-inline:auto;padding-inline:clamp(16px,3vw,28px);padding-block:22px 48px;display:flex;flex-direction:column;gap:18px}
.tabsbar{display:none}
.scrim{display:none}

/* generic */
.ph{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.ph>.grow{flex:1 1 340px}
.ph h1{font-size:25px;font-weight:600}
.ph p{color:var(--muted);max-width:68ch}
.ph .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{box-shadow:none}
.card h3{font-size:15.5px;font-weight:600}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card .hd .more{margin-left:auto;font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 13px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--raised)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--gold-ink)}
.btn.done{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.link{border:0;background:none;color:var(--primary);padding:0}
.btn[disabled]{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--raised);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill svg.i{width:12px;height:12px;stroke-width:2.4}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.pill.blue{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:15px;color:#fff;flex:none;letter-spacing:.02em}
.av.org{border-radius:11px}
.av.sm{width:32px;height:32px;font-size:12px}
.av.lg{width:76px;height:76px;font-size:26px;border:3px solid var(--surface)}
.seal{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--gold-fill);color:var(--gold-ink);flex:none;vertical-align:-3px}
.seal svg.i{width:10px;height:10px;stroke-width:3.2}
.name{font-weight:600}
.nw{white-space:nowrap}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:74px}
.note{background:var(--primary-soft);border-radius:10px;padding:10px 13px;color:var(--ink-2);font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note svg.i{color:var(--primary);margin-top:1px}
.note.gold{background:var(--gold-soft)} .note.gold svg.i{color:var(--gold)}
.note.good{background:var(--good-soft)} .note.good svg.i{color:var(--good)}
.note.crit{background:var(--crit-soft)} .note.crit svg.i{color:var(--crit)}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.list>.li:first-child{border-top:0;padding-top:0}
.list>.li:last-child{padding-bottom:0}
.meter{height:8px;border-radius:99px;background:var(--primary-soft);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--primary);border-radius:99px}
.meter.gold{background:var(--gold-soft)} .meter.gold>i{background:var(--gold-fill)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--raised)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
tr.bad td{background:var(--crit-soft)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;box-shadow:var(--shadow);z-index:60;max-width:calc(100vw - 32px)}
.pop{position:absolute;right:clamp(16px,3vw,28px);top:56px;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;z-index:30}

/* feed */
.guide{background:linear-gradient(120deg,var(--side) 0%,var(--side-2) 100%);color:#DCE6F5;border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.guide h3{color:#fff;font-size:16px;font-weight:600;margin-bottom:3px}
.guide b{color:#F0CB7A;font-weight:600}
.guide button{margin-left:auto;border:0;background:none;color:#9FB2D0;padding:2px}
.composer textarea{border:0;outline:0;background:none;width:100%;resize:none;min-height:54px;font-size:15px}
.composer .tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:11px;margin-top:6px}
.post .body{margin:11px 0 0;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.post .meta{color:var(--muted);font-size:12.5px}
.attach{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--raised)}
.attach .vid{aspect-ratio:16/7;max-width:100%;background:linear-gradient(135deg,#06182F,#12407A 60%,#B8862B);display:grid;place-items:center;color:#fff}
.attach .vid span{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.6)}
.attach .vid svg.i{fill:#fff;stroke:none;width:20px;height:20px;margin-left:3px}
.attach .cap{padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pacts{display:flex;gap:4px;margin-top:12px;padding-top:9px;border-top:1px solid var(--line);flex-wrap:wrap}
.pacts button{border:0;background:none;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:8px;font-weight:600;font-size:13px}
.pacts button:hover{background:var(--raised)}
.pacts button.on{color:var(--primary)}
.pacts button.on svg.i{fill:var(--primary)}
.pacts .scr{margin-left:auto;color:var(--muted);font-size:11.5px;display:inline-flex;align-items:center;gap:5px;padding:6px 0}

/* chat */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(640px,calc(100dvh - 190px));min-height:420px}
.chat .convos{border-right:1px solid var(--line);overflow-y:auto}
.convo{display:flex;gap:10px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.convo.on{background:var(--primary-soft)}
.thread{display:flex;flex-direction:column;min-width:0;min-height:0}
.thread .th{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--raised);min-height:0}
.msg{max-width:min(78%,520px);padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-color:var(--primary);border-radius:14px 14px 4px 14px}
.msg .who{font-size:11.5px;font-weight:700;color:var(--gold);display:block}
.msg .t{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.sendbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.backbtn{display:none}

/* workspace tracker */
.track{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--good)}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--raised);border:2px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;z-index:1}
.step.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.step.now .dot{border-color:var(--gold-fill);color:var(--gold);background:var(--gold-soft)}
.step h4{font-size:14.5px;font-weight:600}
.step .ts{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cal .dow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;background:var(--raised);border-bottom:1px solid var(--line);text-align:center}
.cal .d{min-height:92px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .d:nth-child(7n){border-right:0}
.cal .d.out{background:var(--raised)}
.cal .d b{font-size:12px;font-weight:600;color:var(--ink-2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%}
.cal .d.today b{background:var(--gold-fill);color:var(--gold-ink)}
.ev{font-size:11px;line-height:1.25;background:var(--primary-soft);color:var(--primary);border-radius:6px;padding:3px 6px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;text-align:left;width:100%}

/* tiers and plans */
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tier{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tier.on{border-color:var(--gold-fill);background:var(--gold-soft)}
.tier h4{font-family:var(--display);font-size:15px;font-weight:600}
.plan{display:flex;flex-direction:column;gap:12px}
.plan.hot{border-color:var(--gold-fill);box-shadow:0 0 0 1px var(--gold-fill)}
.plan .price{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.plan li{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.plan li svg.i{color:var(--good);width:15px;height:15px;margin-top:3px;stroke-width:2.6}
.plan .btn{margin-top:auto}

/* kpi */
.kpi .v{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.kpi .l{color:var(--ink-2);font-size:13px}
.delta{font-size:12.5px;font-weight:600;color:var(--good)}
.chartbox svg{display:block;width:100%;height:auto}
.chartbox text{font-family:var(--body);fill:var(--muted);font-size:11px}
.chartbox .val{fill:var(--ink);font-weight:600;font-size:12px}
.chartbox .bar{fill:var(--chart)}
.chartbox .hit{fill:transparent;cursor:pointer}
.chartbox .hit:hover+.bar,.chartbox .hit:focus+.bar{filter:brightness(1.25)}
.chartwrap{position:relative}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;transform:translate(-50%,-100%);white-space:nowrap;z-index:5}

/* profile, join */
.cover{height:110px;background:linear-gradient(120deg,var(--side),var(--side-2) 55%,#B8862B);border-radius:var(--r) var(--r) 0 0}
.phead{padding:0 18px 18px;margin-top:-38px;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.steps span.on{border-color:var(--gold-fill);background:var(--gold-soft);color:var(--gold)}
.steps span.done{color:var(--good);border-color:transparent;background:var(--good-soft)}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.choice.on{border-color:var(--gold-fill);box-shadow:0 0 0 1px var(--gold-fill);background:var(--gold-soft)}
.choice b{font-family:var(--display);font-size:15.5px;font-weight:600}
.code{display:flex;gap:8px}
.code input{width:44px;height:52px;text-align:center;font-family:var(--mono);font-size:20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.switch{display:flex;align-items:center;gap:10px}
.switch input{width:18px;height:18px;accent-color:var(--gold-fill)}
.lockpage{text-align:center;padding:44px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}
.lockpage .big{width:64px;height:64px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.lockpage .big svg.i{width:28px;height:28px}

@media (max-width:1000px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .tiers{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:50;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  #app.open .side{transform:none}
  #app.open .scrim{display:block;position:fixed;inset:0;background:rgba(3,10,21,.55);z-index:40;border:0}
  #menuBtn{display:grid}
  .viewas label{display:none}
  .viewas select{max-width:172px}
  .search{display:none}
  .page{padding-block:16px 96px}
  .tabsbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabsbar button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;padding:4px 6px;border-radius:8px;min-width:56px}
  .tabsbar button.on{color:var(--primary)}
  #toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  .chat{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 250px)}
  .chat .convos{border-right:0}
  .chat.open .convos{display:none}
  .chat:not(.open) .thread{display:none}
  .backbtn{display:grid}
  .cal .d{min-height:54px;padding:4px;align-items:center}
  .cal .ev{width:7px;height:7px;padding:0;border-radius:50%;background:var(--primary);font-size:0;flex:none}
  .cal .dow{padding:6px 2px;font-size:10px}
}
@media (max-width:520px){
  .ph h1{font-size:22px}
  .tiers{grid-template-columns:minmax(0,1fr)}
  .code input{width:38px;height:46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div id="app">
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <button class="scrim" data-act="menu" aria-label="Close menu"></button>
  <div class="main">
    <header class="top" id="top"></header>
    <main id="view"></main>
  </div>
  <nav class="tabsbar" id="tabs" aria-label="Quick navigation"></nav>
</div>
<div id="toast" hidden role="status"></div>

    const H = H0.slice(), w = new Int32Array(64);
    for (let o = 0; o < m.length; o += 64) {

      for (let t = 16; t < 64; t++) { const a = w[t - 15], c = w[t - 2]; w[t] = (w[t - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[t - 7] + (rr(c, 17) ^ rr(c, 19) ^ (c >>> 10))) | 0; }
      let [a, bb, c, d, e, f, g, h] = H;
      for (let t = 0; t < 64; t++) {
        const t1 = (h + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + w[t]) | 0;
        const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
      }
      [a, bb, c, d, e, f, g, h].forEach((v, k) => { H[k] = (H[k] + v) | 0; });
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');

function ledgerStatus() {
  let broken = false; const out = [];
  LEDGER.forEach((r, i) => {
    if (broken) { out.push('after'); return; }
    const prevOk = r.prev === (i ? LEDGER[i - 1].hash : '0'.repeat(64));
    if (prevOk && recHash(r.prev, r) === r.hash) out.push('ok'); else { out.push('bad'); broken = true; }
  });
  return out;
}
VIEWS.ledger = () => {
  const st = S.checked ? ledgerStatus() : null, bad = st ? st.indexOf('bad') : -1;
  return head('Trust ledger', 'A permanent record of every verification and every completed step. Each record carries a fingerprint built from its own content and the record before it, so any later change is detected.',
    `<button class="btn primary" data-act="check">${ic('shield')}Check integrity</button>${S.tamper ? `<button class="btn" data-act="restore">Restore record</button>` : `<button class="btn" data-act="tamper">${ic('flag')}Run tamper test</button>`}`) +
    (st ? (bad < 0 ? `<div class="note good">${ic('check')}<span><b>All ${LEDGER.length} records are intact.</b> Every fingerprint matches its content and links to the record before it.</span></div>`
      : `<div class="note crit">${ic('flag')}<span><b>Record ${bad + 1} was altered after it was written.</b> Its content no longer matches its fingerprint, so it and the ${LEDGER.length - bad - 1} records after it are no longer trusted. Choose Restore record to undo the test.</span></div>`) : '') +
    `<div class="tablewrap"><table><thead><tr><th>No.</th><th>Check</th><th>Time</th><th>Event</th><th>Details</th><th>Recorded by</th><th>Fingerprint</th></tr></thead><tbody>${LEDGER.map((r, i) => `<tr class="${st && st[i] === 'bad' ? 'bad' : ''}"><td class="num">${r.n}</td><td class="nw">${!st ? '<span class="muted small">Not checked</span>' : st[i] === 'ok' ? `<span class="pill good">${ic('check')}Intact</span>` : st[i] === 'bad' ? `<span class="pill crit">${ic('flag')}Altered</span>` : '<span class="pill warn">Untrusted</span>'}</td><td class="nw mono">${fmtTs(r.ts)}</td><td class="nw">${esc(r.type)}</td><td style="min-width:200px">${esc(r.subject)}</td><td class="nw">${esc(r.actor)}</td><td class="nw mono" title="${r.hash}">${r.hash.slice(0, 10)}…${r.hash.slice(-6)}</td></tr>`).join('')}</tbody></table></div>
    <div class="note">${ic('info')}<span>This is the first stage of the hybrid blockchain design. In a later phase the latest fingerprint is published to a public blockchain at set intervals, so nobody, including Hamuwa, can rewrite history unnoticed.</span></div>`;

/* charts */
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function chart(key, title, vals, fmt, axisFmt) {
  axisFmt = axisFmt || fmt;
  const W = 520, H = 230, L = 52, R = 14, T = 22, B = 30, pw = W - L - R, ph = H - T - B;
  const step = niceStep(Math.max(...vals) / 4), top = Math.ceil(Math.max(...vals) / step) * step;
  const y = v => T + ph - v / top * ph, band = pw / vals.length, bw = Math.min(24, band * 0.5);
  let g = '';
  for (let v = 0; v <= top + 1e-9; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v ? 'var(--grid)' : 'var(--axis)'}" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" class="num">${axisFmt(v)}</text>`;
  vals.forEach((v, i) => {
    const x = L + band * i + (band - bw) / 2, yy = y(v), h = T + ph - yy, r = Math.min(4, h / 2);
    g += `<rect class="hit" x="${L + band * i}" y="${T}" width="${band}" height="${ph}" tabindex="0" role="img" aria-label="${KPI.months[i]}: ${fmt(v)}" data-tip="${KPI.months[i]} 2026: ${fmt(v)}" data-f="${1 - v / top}" data-o="${i === vals.length - 1 ? 26 : 8}"/>`;
    if (h > 0) g += `<path class="bar" pointer-events="none" d="M${x} ${T + ph}V${yy + r}a${r} ${r} 0 0 1 ${r} ${-r}h${bw - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}V${T + ph}z"/>`;
    g += `<text x="${x + bw / 2}" y="${H - 9}" text-anchor="middle">${KPI.months[i]}</text>`;
    if (i === vals.length - 1) g += `<text class="val" x="${x + bw / 2}" y="${yy - 7}" text-anchor="middle">${fmt(v)}</text>`;
  });
  const tv = S.tableView[key];
  return `<div class="card"><div class="hd"><h3>${title}</h3><button class="btn sm more" data-act="tableView" data-arg="${key}">${tv ? 'Show chart' : 'Show table'}</button></div>
    ${tv ? `<div class="tablewrap"><table><thead><tr><th>Month</th><th>Value</th></tr></thead><tbody>${vals.map((v, i) => `<tr><td>${KPI.months[i]} 2026</td><td class="num">${fmt(v)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="chartwrap chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}</svg><div class="tip" hidden></div></div>`}</div>`;
}

  return head('Admin console', 'Platform health, content moderation and identity protection for the trust team.') + seg + body;
};

const JTYPES = [['personal', 'Personal', 'For Sri Lankans living overseas.'], ['business', 'Business', 'Startups and SMEs, in Sri Lanka or overseas.'], ['creator', 'Content creator', 'Video makers, writers and hosts, in Sri Lanka or overseas.'], ['recruiter', 'Recruiting agent', 'Licensed agencies, in Sri Lanka or overseas.']];
const JDOCS = { personal: ['Passport or national identity card', 'Proof of overseas residence'], business: ['Certificate of business registration', 'Identity of directors'], creator: ['Passport or national identity card', 'Link to your main channel'], recruiter: ['Certificate of business registration', 'Foreign employment agency licence'] };
VIEWS.join = () => {
  const j = S.join, names = ['Account type', 'Your details', 'Two-step code', 'Documents', 'Done'];
  const blocked = j.type === 'personal' && j.country === 'Sri Lanka';
  let body = '';
  if (j.step === 1) body = `<h3>Which account suits you?</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${JTYPES.map(t => `<button class="choice ${j.type === t[0] ? 'on' : ''}" data-act="joinType" data-arg="${t[0]}"><b>${t[1]}</b><span class="small muted">${t[2]}</span></button>`).join('')}</div>
    <div class="row"><span class="grow"></span><button class="btn primary" data-act="joinNext" ${j.type ? '' : 'disabled'}>Continue${ic('right')}</button></div>`;
  if (j.step === 2) body = `<h3>Tell us who you are</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
      <div class="field"><label for="jName">${j.type === 'personal' || j.type === 'creator' ? 'Full name' : 'Registered business name'}</label><input class="input" id="jName" data-input="jName" value="${esc(j.name || '')}" autocomplete="off"></div>
      <div class="field"><label for="jEmail">Email address</label><input class="input" id="jEmail" type="email" data-input="jEmail" value="${esc(j.email || '')}" autocomplete="off"></div>
      <div class="field"><label for="jCountry">Country of residence</label><select class="input" id="jCountry" data-change="jCountry"><option value="">Select a country</option>${['Australia', 'Canada', 'Qatar', 'Sri Lanka', 'United Arab Emirates', 'United Kingdom', 'United States', 'Other'].map(c => `<option ${j.country === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div></div>
    ${blocked ? `<div class="note crit">${ic('info')}<span><b>Personal accounts are for Sri Lankans living overseas.</b> If you live in Sri Lanka you can open a Business, Content creator or Recruiting agent account, or join a group as a guest when a member invites you.</span></div>` : ''}
    <div class="note gold">${ic('info')}<span>Draft rule for discussion: who may register from Sri Lanka, and how guests are added.</span></div>
    <div class="row"><button class="btn" data-act="joinBack">Back</button><span class="grow"></span><button class="btn primary" data-act="joinNext" ${blocked || !j.country ? 'disabled' : ''}>Continue${ic('right')}</button></div>`;
  if (j.step === 3) body = `<h3>Enter your 6-digit code</h3><p class="muted">We sent a code to ${j.email ? esc(j.email) : 'your email address'}. In this prototype any six digits work.</p>
    <div class="code">${[0, 1, 2, 3, 4, 5].map(i => `<input id="code${i}" inputmode="numeric" maxlength="1" data-input="code" aria-label="Digit ${i + 1}">`).join('')}</div>
    <p class="small muted">You can switch to an authenticator app later. Codes by SMS arrive in a later phase.</p>
    <div class="row"><button class="btn" data-act="joinBack">Back</button><span class="grow"></span><button class="btn primary" data-act="joinNext">Verify${ic('right')}</button></div>`;
  if (j.step === 4) body = `<h3>Add your documents</h3><p class="muted">The trust team checks each document. Once approved, your profile carries the gold verified seal.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${JDOCS[j.type].map((d, i) => `<button class="choice ${j['doc' + i] ? 'on' : ''}" data-act="joinDoc" data-arg="${i}">${ic(j['doc' + i] ? 'check' : 'doc')}<b>${d}</b><span class="small muted">${j['doc' + i] ? 'Added, ready for review' : 'Choose a file'}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" data-act="joinBack">Back</button><span class="grow"></span><button class="btn primary" data-act="joinNext">Submit${ic('right')}</button></div>`;
  if (j.step === 5) body = `<div class="lockpage" style="padding:20px 0"><span class="big">${ic('check')}</span><h3 style="font-size:19px">Your account is ready</h3><p class="muted" style="max-width:52ch">Your documents are with the trust team. You can use Hamuwa now, and the verified seal appears on your profile once the review is complete.</p>
    <div class="row wrap" style="justify-content:center"><button class="btn primary" data-act="go" data-arg="feed">Go to Home</button><button class="btn" data-act="joinReset">Start again</button></div></div>`;
  return head('Sign-up journey', 'What a new member sees when joining Hamuwa, from choosing an account type to submitting documents.') +
    `<div class="steps">${names.map((n, i) => `<span class="${i + 1 === j.step ? 'on' : i + 1 < j.step ? 'done' : ''}">${i + 1 < j.step ? ic('check') : ''}${i + 1}. ${n}</span>`).join('')}</div><div class="card stack">${body}</div>`;
};

/* ---------- actions ---------- */
const A = {
  go: v => go(v),
  menu: () => $('#app').classList.toggle('open'),
  say: t => toast(t),
  theme: () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; if (S.view === 'settings') render(); },
  setTheme: t => { const r = document.documentElement; if (t === 'system') delete r.dataset.theme; else r.dataset.theme = t; render(); },
  notif: () => { S.notif = !S.notif; renderTop(); },
  guideOff: () => { S.guide = false; render(); },
  heldOff: () => { S.held = null; render(); },
  att: () => { S.att = !S.att; const t = $('#postText').value; render(); $('#postText').value = t; },
  like: id => { S.liked[id] = !S.liked[id]; render(); },
  connect: id => { S.connected[id] = !S.connected[id]; if (S.connected[id]) toast('Connection request sent to ' + P[id].name + '.'); render(); },
  netKind: k => { S.netKind = k; render(); },
  openComm: id => { S.comm = id; render(); },
  commBack: () => { S.comm = null; render(); },
  joinComm: id => { S.joined[id] = true; toast('You joined ' + COMMS.find(c => c.id === id).name + '.'); render(); },
  openDm: id => { S.dm = id; S.dmOpen = true; render(); },
  dmBack: () => { S.dmOpen = false; render(); },
  openWs: id => { S.view = 'workspaces'; S.ws = id; render(); try { window.scrollTo(0, 0); } catch (e) {} },
  wsBack: () => { S.ws = null; render(); },
  advance: () => {
    const w = WS.find(x => x.id === S.ws), s = w.steps.find(x => !x[2]); if (!s) return;
    s[2] = nowIso(); const r = addLedger('Step completed', w.short + ': ' + s[0], P[s[1]].name, s[2]); S.checked = null;
    toast('Step completed and written to the trust ledger as record ' + r.n + '.'); render();
  },
  check: () => { S.checked = true; render(); },
  tamper: () => {
    const r = LEDGER.find(x => x.subject.includes('Trade finance approved'));
    S.tamper = { n: r.n, orig: r.subject }; r.subject = r.subject.replace('approved', 'approved for a higher amount'); S.checked = true; render();
  },
  restore: () => { const r = LEDGER[S.tamper.n - 1]; r.subject = S.tamper.orig; S.tamper = null; S.checked = true; render(); },
  calNav: d => { let m = S.cal.m + Number(d), y = S.cal.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.cal = { y, m }; render(); },
  intro: id => { S.intro[id] = !S.intro[id]; if (S.intro[id]) toast('Introduction requested. You will be notified when they respond.'); render(); },
  apply: id => { S.applied[id] = !S.applied[id]; if (S.applied[id]) toast('Application sent with your verified profile.'); render(); },
  upload: i => { S.verify[S.role + i] = 'review'; toast('Document received. It is now in review.'); render(); },
  adminTab: t => { S.adminTab = t; if (S.view !== 'admin') return go('admin'); render(); },
  tableView: k => { S.tableView[k] = !S.tableView[k]; render(); },
  modq: a => { const [id, msg] = a.split('|'); MODQ.splice(MODQ.findIndex(m => m.id === id), 1); toast(msg); render(); },
  idf: a => { const [id, msg] = a.split('|'); IDFLAGS.splice(IDFLAGS.findIndex(m => m.id === id), 1); toast(msg); render(); },
  verq: a => {
    const [id, ok] = a.split('|'), i = VERQ.findIndex(m => m.id === id), v = VERQ[i]; VERQ.splice(i, 1);
    if (ok === '1') { const r = addLedger(v.kind, v.who, 'Hamuwa Trust Team'); S.checked = null; toast('Approved and written to the trust ledger as record ' + r.n + '.'); } else toast('Rejected. ' + v.who + ' has been asked to resubmit.');
    render();
  },
  joinType: t => { S.join.type = t; render(); },
  joinNext: () => {
    if (S.join.step === 3) { const code = [0, 1, 2, 3, 4, 5].map(i => $('#code' + i).value).join(''); if (!/^\d{6}$/.test(code)) { toast('Enter all six digits to continue.'); return; } }
    S.join.step = Math.min(5, S.join.step + 1); render();
  },
  joinBack: () => { S.join.step = Math.max(1, S.join.step - 1); render(); },
  joinDoc: i => { S.join['doc' + i] = !S.join['doc' + i]; render(); },
  joinReset: () => { S.join = { step: 1, type: null, country: '' }; render(); }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) { if (S.notif && !e.target.closest('.pop')) { S.notif = false; renderTop(); } return; }
  if (t.disabled) return;
  const f = A[t.dataset.act]; if (f) f(t.dataset.arg, t);
});
const FORMS = {
  post: () => {
    const text = $('#postText').value.trim(), url = S.att && $('#postUrl') ? $('#postUrl').value.trim() : '';
    if (!text) { toast('Write something before posting.'); return; }
    if (/guaranteed\s+returns?/i.test(text)) { S.held = text; S.att = false; render(); return; }
    S.posts.unshift({ id: 'n' + Date.now(), by: me().id, when: 'Just now', likes: 0, comments: 0, text, att: url ? { t: 'video', title: url, len: '' } : null });
    S.att = false; S.held = null; toast('Posted.'); render();
  },
  commchat: () => { const i = $('#commMsg'), v = i.value.trim(); if (!v) return; CHATS[S.comm].push([me().id, v, nowHm()]); render(); $('#commMsg').focus(); },
  dm: () => {
    const v = $('#dmMsg').value.trim(); if (!v) return; const d = DMS.find(x => x.id === S.dm); d.msgs.push(['me', v, nowHm()]); render(); $('#dmMsg').focus();
    setTimeout(() => { d.msgs.push([d.with, 'Thank you, noted. I will come back to you shortly.', nowHm()]); if (S.view === 'messages' && S.dm === d.id) { const keep = $('#dmMsg') ? $('#dmMsg').value : ''; render(); if ($('#dmMsg')) { $('#dmMsg').value = keep; $('#dmMsg').focus(); } } }, 1400);
  },
  event: () => {
    const title = $('#evTitle').value.trim(), date = $('#evDate').value, time = $('#evTime').value; if (!title || !date || !time) return;
    EVENTS.push({ id: 'n' + Date.now(), date, time, title, plat: $('#evPlat').value, ctx: 'Added by you' });
    const [y, m] = date.split('-').map(Number); S.cal = { y, m: m - 1 }; toast('Meeting added to your calendar.'); render();
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form](); });
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'netQ') { S.netQ = e.target.value; $('#netGrid').innerHTML = netCards(); }
  if (k === 'jName') S.join.name = e.target.value;
  if (k === 'jEmail') S.join.email = e.target.value;
  if (k === 'code') { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1); const n = Number(e.target.id.slice(4)); if (e.target.value && n < 5) $('#code' + (n + 1)).focus(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'q') { S.netQ = e.target.value; S.netKind = 'all'; go('network'); }
  if (e.key === 'Escape') { $('#app').classList.remove('open'); if (S.notif) { S.notif = false; renderTop(); } }
});
document.addEventListener('change', e => {
  const k = e.target.dataset.change; if (!k) return;
  if (k === 'role') { S.role = e.target.value; S.ws = null; S.dm = 'd1'; if (S.role === 'guest') return go('communities'); if (S.view === 'admin' && S.role !== 'admin') return go('feed'); S.comm = null; if (S.role === 'admin' && S.view === 'feed') return go('admin'); render(); }
  if (k === 'jCountry') { S.join.country = e.target.value; render(); }
  if (k === 'twofa') { S.twofa = e.target.value; toast('Two-step sign-in method updated.'); }
});
function tip(e, on) {
  const h = e.target.closest && e.target.closest('.hit'); if (!h) return;
  const wrap = h.closest('.chartwrap'), t = wrap.querySelector('.tip');
  if (!on) { t.hidden = true; return; }
  const r = h.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  t.textContent = h.dataset.tip; t.style.left = (r.left - w.left + r.width / 2) + 'px'; t.style.top = (r.top - w.top + r.height * Number(h.dataset.f) - Number(h.dataset.o)) + 'px'; t.hidden = false;
}
document.addEventListener('mouseover', e => tip(e, true));
document.addEventListener('mouseout', e => tip(e, false));
document.addEventListener('focusin', e => tip(e, true));
document.addEventListener('focusout', e => tip(e, false));

const startView = (location.hash || '').slice(1);
S.view = VIEWS[startView] && startView !== 'admin' ? startView : 'feed';
render();
</script>

</body>
</html>
